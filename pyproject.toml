[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wbggems"
version = "0.1.0"
description = "Auditable, fail-closed GEMS fault-mapping research and submission preflight"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.2,<3",
  "scipy>=1.15,<2",
  "rasterio>=1.4,<2",
  "scikit-learn>=1.6,<2"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "vendor"]
testpaths = ["tests"]
addopts = "-ra"
