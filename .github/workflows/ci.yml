name: Verify research evidence

on:
  pull_request:
  push:
    branches: [main, 'arena/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install exact research dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Regression, metric, provenance, website and artifact tests
        run: python -m pytest -q
      - name: Static syntax and undefined-name checks
        run: python -m ruff check scripts src tests --select E9,F --exclude test_template_evaluator.py
      - name: Diagnose public leaderboard feed shape without modifying evidence
        run: python scripts/probe_leaderboard.py
      - name: Revalidate the actual TIFF and ZIP
        run: |
          python scripts/validate_submission.py docs/downloads/wbg-c1-commutator-research-surface-20261026-acea88448272.tif
          python scripts/validate_submission.py docs/downloads/wbg-c1-commutator-research-surface-20261026-acea88448272.zip
          python scripts/validate_submission.py docs/downloads/wbg2-offcatalogue-density-36k-20261027.tif
          python scripts/validate_submission.py docs/downloads/wbg2-offcatalogue-density-36k-20261027.zip
          python scripts/validate_submission.py docs/downloads/wbggemsdoe1-wbg3-spipmr-wcs-36800-20261027-1458d60c-zeros.tif
          python scripts/validate_submission.py docs/downloads/wbggemsdoe1-wbg3-spipmr-wcs-36800-20261027-1458d60c-zeros.zip
          python scripts/validate_submission.py docs/downloads/wbggemsdoe1-wbg4-csjf1-edti-35135-20261027-b3dacd59-zeros.tif
          python scripts/validate_submission.py docs/downloads/wbggemsdoe1-wbg4-csjf1-edti-35135-20261027-b3dacd59-zeros.zip
      - name: Revalidate all four frozen research downloads and decision-report identity
        run: python scripts/review_releases.py --check
      - name: Verify stopped WBG-2 and WBG-S2 literal registry witnesses
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: src:vendor
        run: |
          python scripts/ci_checked.py python scripts/verify_wbg2_download.py --expect-negative --deep --fetch
          python scripts/ci_checked.py python scripts/review_wbg2.py --check
          python scripts/ci_checked.py python scripts/audit_wbg_s2_safety.py --check --fetch
          python scripts/ci_checked.py python scripts/build_wbg2_site.py
      - name: Recheck inherited frozen TIP1, WBG-H1 & WBG-4 receipts without retraining
        env:
          PYTHONPATH: src:vendor
        run: |
          python scripts/run_tip1_lane.py --verify-recorded
          python scripts/wbg_h1_evaluate_holdout.py --verify-recorded
          python scripts/run_wbg4_lane.py --verify-recorded
          python scripts/validate_release.py
      - name: Rebuild static reports without changing research results
        run: |
          python scripts/build_site.py
          python scripts/build_readme.py
          python scripts/stage_pages.py
          git diff --exit-code

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact optional browser-check dependencies
        run: npm ci
      - name: Render fifteen pages, test filtering and verify research TIFF downloads
        run: |
          python3 scripts/stage_pages.py
          python3 -m http.server 8000 --bind 0.0.0.0 --directory .cache/pages > /tmp/wbg-site.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          BASE_URL=http://127.0.0.1:8000/docs/ BROWSER_COMPAT_LIBS=1 npm run test:browser
      - name: Retain rendered regression screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-review
          path: .cache/browser-review/
          retention-days: 7
