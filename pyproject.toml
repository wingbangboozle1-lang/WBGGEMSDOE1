[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wbggemsdoe1"
version = "0.1.0"
description = "WBGGEMSDOE1 — Dip-Projected Basement-to-Surface Coupling, Tectonic-vs-Fluvial Scarp Discrimination & Multi-Regime Submodular Fault Discovery for the DOE GEMS Prize"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "rasterio>=1.3",
  "scikit-learn>=1.3",
  "pyproj>=3.5",
  "shapely>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "ruff>=0.6",
  "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  "src/gems",
  "scripts/submission_writer.py",
  ".venv",
  ".cache",
  "data",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
